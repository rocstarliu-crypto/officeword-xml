name: Word portable readonly launcher end to end V2.8
on:
  pull_request:
    types: [labeled]
    branches: [main]
concurrency:
  group: word-popup-lab
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  protected-view:
    if: github.event.label.name == 'wordlab-run-v2-8' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Enforce rolling hourly Actions budget
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./word-popup-lab/action-rate-limit-v1.ps1 -OutputDirectory ./lab-results
      - name: Parse exact packaged PowerShell source
        shell: powershell
        run: |
          $checkDir = Join-Path $env:RUNNER_TEMP 'word-launcher-package-parser'
          Expand-Archive ./word-popup-lab/solution/v1.1/Word_ReadOnly_Open_V1_1.zip -DestinationPath $checkDir
          $source = Join-Path $checkDir 'Word_ReadOnly_Open_V1_1.ps1'
          $parseTokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($source, [ref]$parseTokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          Write-Output 'Packaged PowerShell parses successfully'
      - name: Install official Word
        shell: powershell
        run: ./word-popup-lab/v2.8/install_word_v2_8.ps1 -OutputDirectory ./lab-results
      - name: Install UI automation
        run: python -m pip install pywinauto==0.6.9 pywin32 Pillow
      - name: Verify actual portable launcher after PowerShell exits
        shell: powershell
        run: python ./word-popup-lab/v2.8/launcher_test_v2_8.py ./lab-results
      - name: Preserve synthetic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: word-portable-launcher-v2-8
          path: lab-results/
          retention-days: 7
          if-no-files-found: warn
