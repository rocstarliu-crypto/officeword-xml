name: Word real desktop reproduction attempt V1.1
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/word-readonly-install-attempt-v1-1.yml'
      - 'word-popup-lab/v1.1/**'
permissions:
  contents: read
jobs:
  install-and-observe-real-word:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2022
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install official Microsoft Word on disposable runner
        shell: powershell
        run: ./word-popup-lab/v1.1/install_word_v1_1.ps1 -OutputDirectory ./lab-results
      - name: Install UI automation packages
        run: python -m pip install pywinauto==0.6.9 pywin32 Pillow
      - name: Attempt selection in actual Word and capture synthetic UI evidence
        shell: powershell
        run: python ./word-popup-lab/v1.1/reproduce_v1_1.py ./lab-results
      - name: Preserve attempt evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: word-real-ui-attempt-v1-1
          path: lab-results/
          if-no-files-found: warn
          retention-days: 7
