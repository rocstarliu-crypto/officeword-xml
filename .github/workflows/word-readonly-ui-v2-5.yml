name: Word explicit readonly open validation V2.5
on:
  pull_request:
    types: [labeled]
    branches: [main]
concurrency:
  group: word-popup-lab
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  protected-view:
    if: github.event.label.name == 'wordlab-run-v2-5' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Enforce rolling hourly Actions budget
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./word-popup-lab/action-rate-limit-v1.ps1 -OutputDirectory ./lab-results
      - name: Install official Word
        shell: powershell
        run: ./word-popup-lab/v2.5/install_word_v2_5.ps1 -OutputDirectory ./lab-results
      - name: Install UI automation
        run: python -m pip install pywinauto==0.6.9 pywin32 Pillow
      - name: Verify explicit readonly open with actual selection and reversal
        shell: powershell
        run: python ./word-popup-lab/v2.5/readonly_open_v2_5.py ./lab-results
      - name: Preserve synthetic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: word-explicit-readonly-v2-5
          path: lab-results/
          retention-days: 7
          if-no-files-found: warn
