name: Word selection candidate A-B-A V1.4
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/word-readonly-ui-v1-4.yml'
      - 'word-popup-lab/v1.4/**'
permissions:
  contents: read
jobs:
  verify-candidate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install official Word
        shell: powershell
        run: ./word-popup-lab/v1.4/install_word_v1_4.ps1 -OutputDirectory ./lab-results
      - name: Install UI automation
        run: python -m pip install pywinauto==0.6.9 pywin32 Pillow
      - name: Verify baseline candidate repeat and restoration
        shell: powershell
        run: python ./word-popup-lab/v1.4/reproduce_v1_4.py ./lab-results
      - name: Preserve synthetic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: word-candidate-v1-4
          path: lab-results/
          retention-days: 7
          if-no-files-found: warn
