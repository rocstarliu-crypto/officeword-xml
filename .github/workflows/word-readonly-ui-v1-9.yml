name: Word actual ECS gate validation V1.9
on:
  workflow_dispatch:
concurrency:
  group: word-popup-lab
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  trace-and-verify:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Enforce rolling hourly Actions budget
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./word-popup-lab/action-rate-limit-v1.ps1 -OutputDirectory ./lab-results
      - name: Install official Word
        shell: powershell
        run: ./word-popup-lab/v1.9/install_word_v1_9.ps1 -OutputDirectory ./lab-results
      - name: Install UI automation
        run: python -m pip install pywinauto==0.6.9 pywin32 Pillow
      - name: Record positive baseline and actual ECS identifiers
        shell: powershell
        run: python ./word-popup-lab/v1.9/reproduce_v1_9.py ./lab-results baseline
      - name: Upload early ECS identifiers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: word-ecs-identifiers-v1-9
          path: |
            lab-results/ecs-identifiers.json
            lab-results/baseline.json
          retention-days: 7
      - name: Verify exact ECS names and reversal controls
        shell: powershell
        run: python ./word-popup-lab/v1.9/reproduce_v1_9.py ./lab-results candidates
      - name: Preserve synthetic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: word-candidate-v1-9
          path: lab-results/
          retention-days: 7
          if-no-files-found: warn
